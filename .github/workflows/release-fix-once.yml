name: Apply release fixes once

on:
  push:
    branches: [prototype/living-atlas-home]
    paths: [.github/workflows/release-fix-once.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/living-atlas-home
      - name: Apply exact release replacements
        run: python scripts/release_fixes.py
      - name: Commit release fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html work.html about.html case-study-iln.html case-study-roman.html
          git diff --cached --check
          git commit -m "Apply final media and Roman launch updates"
          git push origin HEAD:prototype/living-atlas-home
